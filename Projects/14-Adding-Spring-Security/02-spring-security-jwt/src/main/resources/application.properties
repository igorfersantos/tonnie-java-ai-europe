spring.application.name=spring-security-jwt
security.config.prefix=Bearer
security.config.key=your-256-bit-secret-key-must-be-at-least-32-characters-long
security.config.expiration=3600000


##H2 Database Connection Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.show-sql: true
spring.h2.console.enabled=true